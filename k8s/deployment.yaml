apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-api}
spec:
  replicas: 2
  selector: {matchLabels: {app: fraud-api}}
  template:
    metadata: {labels: {app: fraud-api}}
    spec:
      containers:
      - name: api
        image: YOUR_REGISTRY/real-time-fraud-platform:1.0.0
        ports: [{containerPort: 8000}]
        env: [{name: MODEL_PATH, value: /models/fraud_model.joblib}]
        volumeMounts: [{name: model, mountPath: /models, readOnly: true}]
        readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 15, periodSeconds: 20}
      volumes:
      - name: model
        persistentVolumeClaim: {claimName: fraud-model-pvc}
---
apiVersion: v1
kind: Service
metadata: {name: fraud-api}
spec:
  selector: {app: fraud-api}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: fraud-model-pvc}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
