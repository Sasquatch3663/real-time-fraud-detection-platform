apiVersion: apps/v1
kind: Deployment
metadata: {name: fraud-dashboard}
spec:
  replicas: 1
  selector: {matchLabels: {app: fraud-dashboard}}
  template:
    metadata: {labels: {app: fraud-dashboard}}
    spec:
      containers:
      - name: dashboard
        image: YOUR_REGISTRY/real-time-fraud-platform:1.0.0
        command: ["streamlit", "run", "src/fraud_platform/dashboard.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
        ports: [{containerPort: 8501}]
        env: [{name: API_URL, value: http://fraud-api:8000}]
---
apiVersion: v1
kind: Service
metadata: {name: fraud-dashboard}
spec:
  selector: {app: fraud-dashboard}
  ports: [{port: 8501, targetPort: 8501}]
  type: LoadBalancer
