[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-fraud-platform"
version = "1.0.0"
description = "End-to-end real-time financial fraud detection platform"
requires-python = ">=3.10,<3.13"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pandas>=2.1,<3",
  "numpy>=1.26,<3", "scikit-learn>=1.4,<2", "xgboost>=2.0,<4",
  "joblib>=1.3,<2", "pyyaml>=6,<7", "pydantic>=2.6,<3",
  "mlflow>=2.12,<4", "kafka-python>=2.0,<3", "streamlit>=1.32,<2",
  "requests>=2.31,<3", "evidently>=0.4.30,<1", "feast>=0.40,<1"
]

[project.optional-dependencies]
graph = ["torch>=2.2", "torch-geometric>=2.5"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
